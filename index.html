<!DOCTYPE html>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
         color:#1a2a4a; background:#f4f6fb; line-height:1.7; }
  .hero { background:linear-gradient(135deg,#0F1E4A,#1e3a8a); color:#fff;

  .card { background:#fff; border-radius:16px; padding:24px; margin-top:20px;

  .card h2 { font-size:22px; color:#0F1E4A; margin-bottom:14px;
             border-left:5px solid #ffd54a; padding-left:12px; }
  .svc { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .svc div { background:#f4f6fb; border-radius:10px; padding:16px; text-align:center;
             font-size:18px; font-weight:700; color:#1e3a8a; }

  .info b { color:#0F1E4A; }
  .hours td { padding:6px 10px; font-size:17px; }
  .hours td:first-child { font-weight:700; color:#0F1E4A; }
  .off { color:#c0392b; font-weight:700; }
  .mapbtn { display:inline-block; margin-top:12px; background:#1e3a8a; color:#fff;
            padding:12px 24px; border-radius:30px; text-decoration:none; font-weight:700; }
  footer { text-align:center; color:#8a93a8; font-size:14px; padding:24px; }
  @media(max-width:480px){ .hero h1{font-size:32px;} .svc{grid-template-columns:1fr;} }

</head>
