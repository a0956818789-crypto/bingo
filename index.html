<script>


/* ===================== 手機版：開啟時自己連官網抓最近約 600 期 ===================== */
/* 台灣彩券官方 BINGO BINGO API：
   https://api.taiwanlottery.com/TLCAPIWeB/Lottery/BingoResult?openDate=YYYY-MM-DD&pageNum=1&pageSize=50
   回傳 content[]，每期有 drawTerm（期別）、openTime（開獎時間）、
   以及 20 顆號碼（開出順序 openShowOrder；最後一顆是超級獎號）。 */
const API = 'https://api.taiwanlottery.com/TLCAPIWeB/Lottery/BingoResult';
const WANT = 600;                 // 要抓幾期
const NB = 80, ND = 20;

const $ = id => document.getElementById(id);
function showMsg(html){
  const box = $('f-out') || document.body;
  box.innerHTML = `<div class="stale" style="margin:16px 0">${html}</div>`;
}

function ymd(d){
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
// 從一筆 API 資料取出 20 顆號碼（盡量容錯，官方欄位名改了也多試幾個）
function pickNums(rec){
  const cand = rec.openShowOrder ?? rec.bigShowOrder ?? rec.drawNumberAppear ??
               rec.drawNumberSize ?? rec.openNumber ?? rec.lotteryBingoNumber;
  let arr = [];
  if (Array.isArray(cand)) arr = cand.map(Number);
  else if (typeof cand === 'string') arr = cand.split(/[,\s]+/).filter(Boolean).map(Number);
  return arr.filter(v => v >= 1 && v <= 80);
}
function pickTerm(rec){ return rec.drawTerm ?? rec.period ?? rec.term ?? rec.id; }
function pickTime(rec){ return String(rec.openTime ?? rec.dztTime ?? rec.openTimeStr ?? ''); }

// 連線路線：先直接連官網；被擋就自動改走公開中繼站代抓
const ROUTES = [
  {name:'官網直連', wrap:u => u},
  {name:'中繼站 A', wrap:u => 'https://corsproxy.io/?url=' + encodeURIComponent(u)},
  {name:'中繼站 B', wrap:u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)},
  {name:'中繼站 C', wrap:u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)},
];
let goodRoute = -1;            // 記住上次成功的路線，下次直接用
try { const v = localStorage.getItem('bingoRoute'); if (v !== null && +v >= 0 && +v < ROUTES.length) goodRoute = +v; } catch(e){}
let routeLog = [];

async function getJSON(url, route){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 15000);
  try {
    const res = await fetch(ROUTES[route].wrap(url), {signal: ctl.signal});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    let js;
    try { js = JSON.parse(txt); } catch(e){ throw new Error('回傳的不是資料'); }
    if (!js || typeof js !== 'object') throw new Error('回傳的不是資料');
    return js;
  } catch (e) {
    throw new Error(e && e.name === 'AbortError' ? '逾時' : (e && e.message ? e.message : String(e)));
  } finally { clearTimeout(timer); }
}

// 依序試各條路線，第一條成功的就記住
async function smartJSON(url){
  const order = [];
  if (goodRoute >= 0) order.push(goodRoute);
  for (let i = 0; i < ROUTES.length; i++) if (!order.includes(i)) order.push(i);
  const errs = [];
  for (const r of order){
    try {
      const js = await getJSON(url, r);
      if (goodRoute !== r){
        goodRoute = r;
        try { localStorage.setItem('bingoRoute', String(r)); } catch(e){}
      }
      return js;
    } catch (e) { errs.push(ROUTES[r].name + '：' + e.message); }
  }
  routeLog = errs;
  goodRoute = -1;
  throw new Error('所有連線路線都失敗');
}

// 抓某一天的所有期別（API 有分頁，一頁最多 50，翻到空為止）
async function fetchDay(dateStr){
  const rows = [];
  for (let page = 1; page <= 40; page++){
    const url = `${API}?openDate=${dateStr}&pageNum=${page}&pageSize=50`;
    const js = await smartJSON(url);
    const content = (js && (js.content || (js.data && js.data.content))) || [];
    if (!content.length) break;
    for (const rec of content){
      const nums = pickNums(rec), term = pickTerm(rec), time = pickTime(rec);
      if (nums.length === ND && term != null) rows.push({t: +term, time, o: nums});
    }
    if (content.length < 50) break;
  }
  return rows;
}

// 一天天往回抓，湊到 WANT 期
async function loadData(){
  routeLog = [];
  showMsg('正在連線台灣彩券，抓取最新開獎…');
  const all = [];
  const day = new Date();
  let emptyDays = 0;
  for (let i = 0; i < 20 && all.length < WANT; i++){
    const ds = ymd(day);
    let rows = [];
    try { rows = await fetchDay(ds); }
    catch (e) { throw e; }
    if (rows.length === 0) emptyDays++; else emptyDays = 0;
    all.push(...rows);
    showMsg(`已抓到 ${all.length} 期…<br><small>（連線方式：${goodRoute>=0?ROUTES[goodRoute].name:'嘗試中'}）</small>`);
    day.setDate(day.getDate() - 1);
    if (emptyDays >= 3) break;      // 連三天沒資料就停（例如還沒開獎）
  }
  if (!all.length) throw new Error('沒有抓到任何資料');

  // 依期別排序（小在前），去重，取最新 WANT 期
  const map = new Map();
  for (const r of all) if (!map.has(r.t)) map.set(r.t, r);
  let list = [...map.values()].sort((a, b) => a.t - b.t);
  if (list.length > WANT) list = list.slice(list.length - WANT);

  // 一天從 07:05 開始、每 5 分鐘一期，算出每期是當天第幾期 w（給 drawTime 用）
  const byDay = {};
  list.forEach(r => {
    const dayKey = String(r.t).slice(0, 7);   // 期別前幾碼同一天
    byDay[dayKey] = (byDay[dayKey] || 0);
  });
  // w：同一天內的順序
  const counter = {};
  list.forEach(r => {
    const dayKey = String(r.t).slice(0, 7);
    r.w = (counter[dayKey] = (counter[dayKey] === undefined ? 0 : counter[dayKey] + 1));
  });

  // 組出和桌機版一樣的 D 物件
  const n = list.length;
  let draws = '';
  for (const r of list){
    const sorted = r.o.slice().sort((a, b) => a - b);
    draws += sorted.map(v => String(v).padStart(2, '0')).join('');
  }
  return {
    n,
    draws,
    recent: list.map(r => ({t: r.t, w: r.w, o: r.o})),
    advanced: null,
    fetchedAt: new Date()
  };
}

function boot(Dinput){
  const D = Dinput;

/* ---------- 解碼：字串 -> 每期的號碼陣列 ---------- */
/* 資料裡有些期數被重複記錄了兩次（同一期、同一組號碼），會讓次數被多算。
   20 個號碼完全相同的兩期在真實開獎中幾乎不可能發生，所以只保留第一筆。 */
const draws = (() => {
  const raw = new Uint8Array(D.n * ND);
  for (let i = 0; i < D.n * ND; i++) raw[i] = +D.draws.substr(i * 2, 2);
  const seen = new Set(), keep = [];
  for (let d = 0; d < D.n; d++){
    const key = Array.from(raw.subarray(d * ND, d * ND + ND)).sort((a, b) => a - b).join(',');
    if (!seen.has(key)){ seen.add(key); keep.push(d); }
  }
  const out = new Uint8Array(keep.length * ND);
  keep.forEach((d, i) => out.set(raw.subarray(d * ND, d * ND + ND), i * ND));
  D.dupRemoved = D.n - keep.length;
  D.n = keep.length;
  return out;
})();

{ const seen = new Set();
  D.recent = D.recent.filter(d => !seen.has(d.t) && seen.add(d.t)); }

const RANGES = [100, 300, 500, 1000, 2000, 3000, 5000, 10000]
  .filter(v => v < D.n).concat([D.n]);
const rangeLabel = v => v === D.n ? `全部 ${D.n} 期` : `最近 ${v} 期`;

/* ---------- 純機率下「最高會衝到多少」 ---------- */
// k 個候選裡最大值的 97.5 百分位：Φ⁻¹(0.975^(1/k))。
// k 只有三種可能（80 個號碼 / 79 個配對 / 3081 個三連組合），
// 由 scipy 精算後直接嵌入，不在前端做反常態近似。
const MAXZ = {"80": 3.4171, "79": 3.4137, "3081": 4.3085};
function maxZ(k){ return MAXZ[k]; }
// 在 m 次試驗、單次機率 p0、k 個候選下，觀測到的最高比率大約會是多少
function noiseCeil(m, p0, k){
  return p0 + maxZ(k) * Math.sqrt(p0 * (1 - p0) / m);
}
const pct = x => (x * 100).toFixed(2) + '%';
// 小於 0.1% 的機率，百分比會顯示成 0.00%，改用「約幾分之 1」
const prob = x => x >= 0.001 ? pct(x) : `約 ${Math.round(1 / x).toLocaleString()} 分之 1`;

/* ---------- 4 加 1、5 加 1、6 加 1 用的工具 ---------- */
// 組合有 150 萬 ~ 2.7 億種，每種的期望次數很小，常態近似會把上限估太低，
// 所以改用二項分布精算：找最小的 c，讓「k 組裡最高次數超過 c」的機率不到 2.5%。
function binomCeil(m, p0, k){
  const tail = -Math.expm1(Math.log(0.975) / k);
  const q = p0 / (1 - p0);
  let pmf = Math.exp(m * Math.log1p(-p0)), cdf = pmf, c = 0;
  while (1 - cdf > tail && c < m){ pmf *= (m - c) / (c + 1) * q; c++; cdf += pmf; }
  return c / m;
}
// C[n][r] = n 取 r 的組合數，用來把一組號碼換成唯一的編號
function binomTable(n, r){
  const C = [];
  for (let i = 0; i <= n; i++){
    C.push(new Float64Array(r + 1));
    C[i][0] = 1;
    for (let j = 1; j <= Math.min(i, r); j++) C[i][j] = C[i-1][j-1] + C[i-1][j];
  }
  return C;
}
// 編號換回 r 個號碼（0 起算）
function unrank(C, idx, r){
  const out = [];
  for (let j = r; j >= 1; j--){
    let v = j - 1;
    while (C[v + 1][j] <= idx) v++;
    idx -= C[v][j]; out.push(v);
  }
  return out;
}
// 找出「A + 另外 r 個號碼」次數最高的 25 組（r = 4、5、6）。
// 6 加 1 有 2.7 億種組合，沒辦法一次開陣列全部計數，所以先依組合裡
// 最小的 r-4 個號碼分批，每批只用一個「4 個號碼」大小的計數陣列，
// 算完一批、留下高次數的、清空，再算下一批。
function bigCombos(hitDraws, A, r){
  const L = r - 4;
  const C = binomTable(NB - 1, r);
  // 每期除了 A 以外的 19 個號碼，換成 0..78 並排序
  const others = hitDraws.map(b => {
    const s = new Int32Array(ND - 1); let m = 0;
    for (let j = 0; j < ND; j++){ const v = draws[b + j];
      if (v !== A) s[m++] = v < A ? v - 1 : v - 2; }
    return s.sort();
  });
  // 依前綴分批
  const groups = new Map();
  const add = (key, d) => { let g = groups.get(key); if (!g) groups.set(key, g = []); g.push(d); };
  others.forEach((s, d) => {
    if (L === 0) add(-1, d);
    else if (L === 1) for (let x = 0; x < s.length; x++) add(s[x], d);
    else for (let x = 0; x < s.length; x++)
      for (let y = x + 1; y < s.length; y++) add(s[x] * 79 + s[y], d);
  });

  const buf = new Int32Array(C[NB - 1][4]);
  const touched = new Int32Array(buf.length);   // 記下這批有被加過的格子
  let cand = [], thr = 1;
  const trim = () => { cand.sort((x, y) => y.c - x.c); cand.length = Math.min(cand.length, 25);
                       if (cand.length === 25) thr = cand[24].c; };
  for (const [key, list] of groups){
    if (list.length < thr) continue;          // 這批最多也只會出現 list.length 次
    const last = L === 0 ? -1 : L === 1 ? key : key % 79;
    let nt = 0;
    for (const d of list){
      const s = others[d], n = s.length;
      let st = 0; while (st < n && s[st] <= last) st++;
      for (let a = st; a < n; a++){ const ia = C[s[a] - last - 1][1];
        for (let b = a + 1; b < n; b++){ const ib = ia + C[s[b] - last - 1][2];
          for (let c = b + 1; c < n; c++){ const ic = ib + C[s[c] - last - 1][3];
            for (let e = c + 1; e < n; e++){
              const x = ic + C[s[e] - last - 1][4];
              if (buf[x]++ === 0) touched[nt++] = x;
            }
          }}}
    }
    for (let t = 0; t < nt; t++){
      const i = touched[t];
      if (buf[i] >= thr){ cand.push({key, i, c: buf[i]}); if (cand.length > 4000) trim(); }
      buf[i] = 0;
    }
  }
  trim();

  const rows = cand.map(o => {
    const last = L === 0 ? -1 : L === 1 ? o.key : o.key % 79;
    const prefix = L === 0 ? [] : L === 1 ? [o.key] : [Math.floor(o.key / 79), o.key % 79];
    const nums = prefix.concat(unrank(C, o.i, 4).map(v => v + last + 1))
      .map(v => v <= A - 2 ? v + 1 : v + 2).sort((x, y) => x - y);
    return {label: `<span class="num">${A}</span>` +
      nums.map(v => `<span class="num">${v}</span>`).join(''),
      c: o.c, r: o.c / hitDraws.length};
  });
  let p0 = 1;
  for (let i = 1; i <= r; i++) p0 *= (ND - i) / (NB - i);
  return {rows, p0, k: C[NB - 1][r]};
}

/* ---------- 7 加 1、8 加 1、9 加 1 用的工具 ---------- */
// 這三種組合有 29 億 ~ 2,200 億種，沒辦法每種開一格來數。
// 改用「兩期兩期比對」：一組號碼如果一起出現在 d 期，它就會出現在
// d×(d-1)÷2 對期數的共同號碼裡。所以只要數出每組號碼被幾對期數共有，
// 就能準確換算回它出現了幾期；只出現過 1 期的組合不需要逐一列出。
// 依組合裡最小的號碼分批，每批只比對同時含有這個號碼的期數。
function hugeCombos(hitDraws, A, r){
  const popc = x => { x -= (x >>> 1) & 0x55555555;
    x = (x & 0x33333333) + ((x >>> 2) & 0x33333333);
    return (((x + (x >>> 4)) & 0x0F0F0F0F) * 0x01010101) >>> 24; };
  const clz = Math.clz32, sqrt = Math.sqrt, round = Math.round;
  const M = hitDraws.length;
  const C = binomTable(NB - 1, r);
  // 每期除了 A 以外的 19 個號碼（換成 0..78），存成 3 個 32 位元的遮罩
  const W = new Uint32Array(M * 3);
  const has = Array.from({length: NB - 1}, () => []);
  hitDraws.forEach((b, d) => {
    for (let j = 0; j < ND; j++){
      const v = draws[b + j]; if (v === A) continue;
      const u = v < A ? v - 1 : v - 2;
      W[d * 3 + (u >> 5)] |= 1 << (u & 31);
      has[u].push(d);
    }
  });
  const need = r - 1;                       // 最小號碼 x 以外還要幾個
  const el = new Int32Array(ND), idx = new Int32Array(ND);
  const pairs = new Map();
  let cand = [], thr = 2;
  const trim = () => { cand.sort((a, b) => b.c - a.c); cand.length = Math.min(cand.length, 25);
                       if (cand.length === 25) thr = Math.max(2, cand[24].c); };
  for (let x = 0; x < NB - 1; x++){
    const L = has[x];
    if (L.length < thr) continue;            // 這批最多也只會出現 L.length 期
    // 只留比 x 大的號碼
    const mk = [0, 1, 2].map(w => { const sh = x - 32 * w + 1;
      return sh <= 0 ? 0xFFFFFFFF : sh >= 32 ? 0 : (0xFFFFFFFF << sh) >>> 0; });
    pairs.clear();
    for (let i = 0; i < L.length; i++){
      const a = L[i] * 3;
      for (let j = i + 1; j < L.length; j++){
        const b = L[j] * 3;
        const w0 = W[a] & W[b] & mk[0], w1 = W[a + 1] & W[b + 1] & mk[1],
              w2 = W[a + 2] & W[b + 2] & mk[2];
        const n = popc(w0) + popc(w1) + popc(w2);
        if (n < need) continue;
        // 兩期共同的號碼（換成相對 x 的位置，由小到大）
        let k = 0, t;
        t = w0; while (t){ const lb = t & -t; el[k++] = 31 - clz(lb) - x - 1; t ^= lb; }
        t = w1; while (t){ const lb = t & -t; el[k++] = 63 - clz(lb) - x - 1; t ^= lb; }
        t = w2; while (t){ const lb = t & -t; el[k++] = 95 - clz(lb) - x - 1; t ^= lb; }
        // 列出共同號碼裡所有「need 個一組」，每組換成唯一編號後加 1
        for (let q = 0; q < need; q++) idx[q] = q;
        for (;;){
          let key = 0;
          for (let q = 0; q < need; q++) key += C[el[idx[q]]][q + 1];
          pairs.set(key, (pairs.get(key) || 0) + 1);
          let q = need - 1;
          while (q >= 0 && idx[q] === n - need + q) q--;
          if (q < 0) break;
          idx[q]++;
          for (let z = q + 1; z < need; z++) idx[z] = idx[z - 1] + 1;
        }
      }
    }
    for (const [key, p] of pairs){
      const d = round((1 + sqrt(1 + 8 * p)) / 2);   // 共有 p 對 → 出現 d 期
      if (d >= thr){ cand.push({x, key, c: d}); if (cand.length > 4000) trim(); }
    }
  }
  pairs.clear();
  trim();
  const rows = cand.map(o => {
    const nums = [o.x].concat(unrank(C, o.key, need).map(v => v + o.x + 1))
      .map(v => v <= A - 2 ? v + 1 : v + 2).sort((a, b) => a - b);
    return {label: `<span class="num">${A}</span>` +
      nums.map(v => `<span class="num">${v}</span>`).join(''),
      c: o.c, r: o.c / M};
  });
  let p0 = 1;
  for (let i = 1; i <= r; i++) p0 *= (ND - i) / (NB - i);
  return {rows, p0, k: C[NB - 1][r]};
}
// 和 binomCeil 一樣，但機率小到 1e-13 以下時改從尾端往回加，避免精度不夠
function binomCeilTail(m, p0, k){
  const tail = -Math.expm1(Math.log(0.975) / k);
  const top = Math.min(m, 200), q = p0 / (1 - p0), pmf = new Float64Array(top + 1);
  pmf[0] = Math.exp(m * Math.log1p(-p0));
  for (let c = 0; c < top; c++) pmf[c + 1] = pmf[c] * (m - c) / (c + 1) * q;
  let s = 0;                                  // s = 超過 c 次的機率
  for (let c = top; c >= 0; c--){ if (s > tail) return (c + 1) / m; s += pmf[c]; }
  return 0;
}

/* ---------- 功能一：號碼出現次數 ---------- */
function renderFreq(){
  const N = +document.getElementById('f-range').value;
  const sort = document.getElementById('f-sort').value;
  const start = (D.n - N) * ND;
  const cnt = new Int32Array(NB + 1);
  for (let i = start; i < D.n * ND; i++) cnt[draws[i]]++;

  const p0 = ND / NB;
  const ceil = noiseCeil(N, p0, NB);
  const floor = 2 * p0 - ceil;
  document.getElementById('f-base').innerHTML =
    `每個號碼的機率固定是 <b>25.00%</b>（一期開 20 個，共 80 個號碼）。<br>
     以 ${N} 期來算，就算機器完全公平，最高的號碼也會自然衝到
     <b>${pct(ceil)}</b>、最低會掉到 <b>${pct(floor)}</b>。
     落在這中間的差距都只是碰巧，不代表那個號碼比較會開。`;

  let rows = [];
  for (let i = 1; i <= NB; i++) rows.push({n: i, c: cnt[i], r: cnt[i] / N});
  if (sort === 'desc') rows.sort((a, b) => b.c - a.c);
  else if (sort === 'asc') rows.sort((a, b) => a.c - b.c);

  const lo = Math.min(floor, ...rows.map(r => r.r)) - 0.005;
  const hi = Math.max(ceil,  ...rows.map(r => r.r)) + 0.005;
  const px = v => (v - lo) / (hi - lo) * 100;

  document.getElementById('f-out').innerHTML = `
    <table><thead><tr><th>號碼</th><th>出現次數</th><th>出現率</th>
      <th style="text-align:left">和 25% 的差距</th><th>判讀</th></tr></thead>
    <tbody>${rows.map(r => {
      const out = r.r > ceil || r.r < floor;
      return `<tr>
        <td><span class="num">${r.n}</span></td>
        <td>${r.c}</td><td>${pct(r.r)}</td>
        <td><span class="meter">
          <i style="left:${px(Math.min(r.r, p0))}%;
             width:${Math.abs(px(r.r) - px(p0))}%"></i>
          <u style="left:${px(p0)}%" title="25%"></u></span></td>
        <td><span class="verdict ${out ? 'v-high' : 'v-noise'}">${
          out ? '超出自然範圍' : '正常範圍'}</span></td></tr>`;
    }).join('')}</tbody></table>
    <p class="hint">黃色細線是 25% 的位置。藍色長度代表這個號碼離 25% 有多遠。
      統計範圍選越少期，差距看起來會越大 — 那是期數不夠造成的，不是號碼變熱了。
      可以切到「最近 100 期」和「全部」對照看看。</p>`;
}

/* ---------- 功能二：號碼組合 ---------- */
function renderCombo(){
  const A = +document.getElementById('c-anchor').value;
  const size = +document.getElementById('c-size').value;
  const N = +document.getElementById('c-range').value;
  const start = D.n - N;
  const out = document.getElementById('c-out');
  out.innerHTML = size >= 6 ? '<p class="busy">組合非常多，計算中，大約需要幾秒鐘…</p>'
                            : '<p class="busy">計算中…</p>';

  setTimeout(() => {
    // 找出含 A 的期數
    const hitDraws = [];
    for (let d = start; d < D.n; d++){
      const b = d * ND;
      for (let j = 0; j < ND; j++)
        if (draws[b + j] === A){ hitDraws.push(b); break; }
    }
    const M = hitDraws.length;
    let rows, p0, k, label;

    if (size === 2){
      p0 = (ND - 1) / (NB - 1);                  // 19/79
      k = NB - 1;
      const c = new Int32Array(NB + 1);
      for (const b of hitDraws)
        for (let j = 0; j < ND; j++){ const v = draws[b + j]; if (v !== A) c[v]++; }
      rows = [];
      for (let i = 1; i <= NB; i++) if (i !== A)
        rows.push({label: `<span class="num">${A}</span><span class="num">${i}</span>`,
                   c: c[i], r: c[i] / M});
      label = `號碼 ${A} 和另外 1 個號碼`;
    } else if (size === 3){
      p0 = (ND - 1) * (ND - 2) / ((NB - 1) * (NB - 2));   // 19*18/(79*78)
      k = (NB - 1) * (NB - 2) / 2;
      const c = new Int32Array((NB + 1) * (NB + 1));
      const tmp = new Int32Array(ND);
      for (const b of hitDraws){
        let m = 0;
        for (let j = 0; j < ND; j++){ const v = draws[b + j]; if (v !== A) tmp[m++] = v; }
        for (let x = 0; x < m; x++) for (let y = x + 1; y < m; y++){
          const a = Math.min(tmp[x], tmp[y]), z = Math.max(tmp[x], tmp[y]);
          c[a * (NB + 1) + z]++;
        }
      }
      rows = [];
      for (let a = 1; a <= NB; a++){ if (a === A) continue;
        for (let z = a + 1; z <= NB; z++){ if (z === A) continue;
          const v = c[a * (NB + 1) + z];
          if (v) rows.push({label:
            `<span class="num">${A}</span><span class="num">${a}</span><span class="num">${z}</span>`,
            c: v, r: v / M});
        }}
      label = `號碼 ${A} 和另外 2 個號碼`;
    } else if (size === 4){
      // 3 個號碼加 1 個：組合 7.9 萬種，直接開一個陣列計數
      p0 = (ND - 1) * (ND - 2) * (ND - 3) / ((NB - 1) * (NB - 2) * (NB - 3));
      const C = binomTable(NB - 1, 3);
      k = C[NB - 1][3];
      const c = new Int32Array(k), s = new Int32Array(ND);
      for (const b of hitDraws){
        let m = 0;
        for (let j = 0; j < ND; j++){ const v = draws[b + j];
          if (v !== A) s[m++] = v < A ? v - 1 : v - 2; }
        s.subarray(0, m).sort();
        for (let x = 0; x < m; x++) for (let y = x + 1; y < m; y++){
          const iy = C[s[x]][1] + C[s[y]][2];
          for (let z = y + 1; z < m; z++) c[iy + C[s[z]][3]]++;
        }
      }
      const idx = [];
      for (let i = 0; i < k; i++) if (c[i]) idx.push(i);
      idx.sort((x, y) => c[y] - c[x]);
      rows = idx.slice(0, 25).map(i => {
        const nums = unrank(C, i, 3).map(v => v <= A - 2 ? v + 1 : v + 2).sort((x, y) => x - y);
        return {label: `<span class="num">${A}</span>` +
          nums.map(v => `<span class="num">${v}</span>`).join(''), c: c[i], r: c[i] / M};
      });
      label = `號碼 ${A} 和另外 3 個號碼`;
    } else {
      ({rows, p0, k} = size >= 8 ? hugeCombos(hitDraws, A, size - 1)
                                 : bigCombos(hitDraws, A, size - 1));
      label = `號碼 ${A} 和另外 ${size - 1} 個號碼`;
    }

    rows.sort((x, y) => y.c - x.c);
    const ceil = size >= 8 ? binomCeilTail(M, p0, k)
               : size >= 4 ? binomCeil(M, p0, k) : noiseCeil(M, p0, k);
    const top = rows.slice(0, 25);

    document.getElementById('c-base').innerHTML =
      `在這 ${N} 期裡，號碼 ${A} 出現了 <b>${M}</b> 次。<br>
       ${label}一起出現的機率，數學上固定是 <b>${prob(p0)}</b>。
       ${size === 2 ? `（注意這比 25% 還低一點 —— 因為 ${A} 已經佔掉 20 個名額中的 1 個，
         剩下 19 個名額要分給 79 個號碼。）` : ''}<br>
       用 ${M} 次來排名 ${k.toLocaleString()} 種組合，就算機器完全公平，
       排第一名的組合也會自然衝到 <b>${pct(ceil)}</b>。
       沒有超過這個數的，就只是碰巧排在前面而已。`;

    if (!top.length){
      out.innerHTML = `<p class="empty">這 ${N} 期裡，${label}的組合，每一組都最多只一起出現過 1 次，
        沒有排行可看。可以把統計範圍調大一些再看。</p>`;
      return;
    }
    const hi = Math.max(ceil, top[0].r) * 1.06;
    out.innerHTML = `
      <table><thead><tr><th>組合</th><th>一起出現</th><th>出現率</th>
        <th style="text-align:left">對照純機率 ${prob(p0)}</th><th>判讀</th></tr></thead>
      <tbody>${top.map(r => `<tr>
        <td>${r.label}</td><td>${r.c} 次</td><td>${pct(r.r)}</td>
        <td><span class="meter">
          <i style="width:${r.r / hi * 100}%"></i>
          <u style="left:${p0 / hi * 100}%" title="純機率"></u>
          <u style="left:${ceil / hi * 100}%;background:#B0243F" title="自然上限"></u>
        </span></td>
        <td><span class="verdict ${r.r > ceil ? 'v-high' : 'v-noise'}">${
          r.r > ceil ? '超出自然範圍' : '碰巧'}</span></td></tr>`).join('')}
      </tbody></table>
      <p class="hint">黃線是純機率位置，紅線是「公平機器下第一名自然會到的高度」。
        排行榜第一名幾乎一定會超過黃線 —— 那是排名這個動作本身造成的，
        ${k.toLocaleString()} 種組合裡總得有一個最高。要有意義，必須超過紅線。<br>
        換不同的號碼、換組合大小、換統計範圍，可以看到排行榜整個洗牌 ——
        每次的「最強組合」都不一樣，這正是它們只是碰巧的證據。${size >= 8 ?
        `<br>只一起出現過 1 次的組合有好幾百萬組，表格只列出一起出現 2 次以上的。` : ''}</p>`;
  }, 10);
}

/* ---------- 功能三：最近開獎 ---------- */

         String(m % 60).padStart(2, '0');

      const sup   = d.o[d.o.length - 1];          // 超級獎號 = 最後開出的球
      return `<tr>
        <td class="rmeta">${d.t}</td>
        <td class="rmeta">${drawTime(d.w)}</td>
        <td><div class="balls">${d.o.map(v =>
          `<span class="ball ${v > 40 ? 'big' : ''} ${v === mark ? 'mark' : ''} ${
            v === sup ? 'super' : ''}" title="${
            v === sup ? '超級獎號（最後開出）' : ''}">${v}</span>`).join('')}</div></td>
        <td class="rmeta">${small} / ${20 - small}</td>
        <td class="rmeta">${odd} / ${20 - odd}</td></tr>`;
    }).join('')}</tbody></table>
    <p class="hint">號碼依實際開出順序排列，不是由小到大。
      淺藍色是大號（41–80），描黑框的是該期<b>超級獎號</b>（最後開出的那顆）。
      在上方選一個號碼可以把它標成黃色，方便追。<br>
      「小 / 大」和「單 / 雙」是該期 20 個號碼的個數，13 個以上才算中。</p>`;
}

/* ---------- 功能四：超級獎號 ---------- */
// 超級獎號 = 每期 20 顆裡最後開出的那顆（與「最近開獎」的黑框同一顆）
function renderSuper(){
  const want = +document.getElementById('s-range').value;
  const sort = document.getElementById('s-sort').value;
  const list = D.recent.slice(-want);
  const N = list.length;
  const out = document.getElementById('s-out');
  if (!N){ out.innerHTML = '<p class="empty">沒有資料</p>'; return; }

  const cnt = new Int32Array(NB + 1);
  const lastAt = new Int32Array(NB + 1).fill(-1);
  list.forEach((d, i) => { const v = d.o[d.o.length - 1]; cnt[v]++; lastAt[v] = i; });

  const p0 = 1 / NB;
  const ceil = binomCeil(N, p0, NB);
  const ceilN = Math.round(ceil * N);

  let rows = [];
  for (let v = 1; v <= NB; v++)
    rows.push({v, c: cnt[v], r: cnt[v] / N, gap: lastAt[v] < 0 ? null : N - 1 - lastAt[v]});
  const gapKey = r => r.gap === null ? Infinity : r.gap;
  if (sort === 'desc') rows.sort((a, b) => b.c - a.c || gapKey(a) - gapKey(b));
  else if (sort === 'gap') rows.sort((a, b) => gapKey(b) - gapKey(a));

  const stale = N < want
    ? `<div class="stale">目前檔案只帶了最近 ${N} 期的開出順序，已用全部 ${N} 期計算。</div>` : '';
  document.getElementById('s-base').innerHTML =
    `每期最後開出的那顆就是超級獎號，所以每個號碼當超級獎號的機率固定是 <b>1.25%</b>（80 分之 1）。<br>
     以 ${N} 期來算，平均每個號碼只會當 <b>${(N / NB).toFixed(1)} 次</b>；
     就算機器完全公平，當最多次的號碼也會自然衝到 <b>${ceilN} 次（${pct(ceil)}）</b>。
     沒有超過這個數的，就只是碰巧。`;

  const hi = Math.max(ceil, ...rows.map(r => r.r)) * 1.06;
  out.innerHTML = stale + `
    <table><thead><tr><th>號碼</th><th>當超級獎號</th><th>比率</th>
      <th style="text-align:left">對照純機率 1.25%</th><th>上次當</th><th>判讀</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td><span class="num">${r.v}</span></td>
      <td>${r.c} 次</td><td>${pct(r.r)}</td>
      <td><span class="meter">
        <i style="width:${r.r / hi * 100}%"></i>
        <u style="left:${p0 / hi * 100}%" title="純機率"></u>
        <u style="left:${ceil / hi * 100}%;background:#B0243F" title="自然上限"></u>
      </span></td>
      <td>${r.gap === null ? `${N} 期內沒當過` : r.gap === 0 ? '最新一期' : `${r.gap} 期前`}</td>
      <td><span class="verdict ${r.r > ceil ? 'v-high' : 'v-noise'}">${
        r.r > ceil ? '超出自然範圍' : '碰巧'}</span></td></tr>`).join('')}</tbody></table>
    <p class="hint">黃線是純機率 1.25%，紅線是「公平機器下當最多次的號碼自然會到的高度」。
      就算統計到 600 期，每個號碼平均也才當 7 到 8 次，所以有的號碼當了好幾次、
      有的很少甚至一次都沒有，都很正常。換一個統計範圍，排行榜就會整個洗牌。<br>
      「上次當」是這個號碼最近一次當超級獎號是幾期以前，久沒當不代表下一期比較容易當。</p>`;
}

/* ---------- 進階區 ---------- */
if (D.advanced){
  const A = D.advanced;
  document.getElementById('adv').hidden = false;
  document.getElementById('adv-body').innerHTML = `<div class="card">
    <p style="margin:0 0 12px"><b>${A.verdict}</b>　
      <span style="color:var(--muted);font-size:14px">
      跨六組檢定 BH-FDR 校正後最小 q = ${A.family_min_q.toFixed(4)}</span></p>
    ${A.tests.map(t => `<div class="trow">
      <span class="nm">${t.name}</span>
      <span class="pv">p=${t.p < 1e-4 ? t.p.toExponential(1) : t.p.toFixed(4)}
        · q=${t.q_family.toFixed(4)}</span>
      <span class="verdict ${t.q_family < 0.05 ? 'v-high' : 'v-noise'}">${
        t.q_family < 0.05 ? '有訊號' : '雜訊'}</span></div>`).join('')}
    <p class="hint">目前樣本下，最熱號信賴區間上緣換算的相對優勢為
      +${A.best_edge_pct.toFixed(2)}%，遠低於彩券的莊家抽成。
      詳細圖表請用 <code>python bingo_lab.py bingo2.csv</code>。</p></div>`;
}

/* ---------- 初始化 ---------- */
document.getElementById('total').textContent = D.n.toLocaleString();
if (D.dupRemoved) document.querySelector('.sub').insertAdjacentText('beforeend',
  `另有 ${D.dupRemoved} 筆重複記錄的期數，已自動排除。`);
for (const id of ['f-range', 'c-range'])
  document.getElementById(id).innerHTML = RANGES.map(v =>
    `<option value="${v}" ${v === D.n ? 'selected' : ''}>${rangeLabel(v)}</option>`).join('');
document.getElementById('c-anchor').innerHTML =
  Array.from({length: NB}, (_, i) =>
    `<option value="${i+1}" ${i === 11 ? 'selected' : ''}>${i+1}</option>`).join('');

document.getElementById('r-mark').innerHTML = '<option value="0">不標記</option>' +
  Array.from({length: NB}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('');

const CTLS = ['f-range','f-sort','c-anchor','c-size','c-range','r-count','r-mark','s-range','s-sort'];
const BTNS = [0,1,2,3].map(i => document.getElementById('m' + i));
let cur = 0;

/* 狀態寫進網址 hash：自動重載後不會跳回預設畫面 */
function saveState(){
  const st = {m: cur};
  CTLS.forEach(id => st[id] = document.getElementById(id).value);
  history.replaceState(null, '', '#' + encodeURIComponent(JSON.stringify(st)));
}
function loadState(){
  if (!location.hash) return 0;
  try {
    const st = JSON.parse(decodeURIComponent(location.hash.slice(1)));
    CTLS.forEach(id => { const e = document.getElementById(id);
      if (st[id] !== undefined && [...e.options].some(o => o.value === st[id]))
        e.value = st[id]; });
    return st.m || 0;
  } catch { return 0; }
}

function mode(i){
  cur = i;
  BTNS.forEach((b, j) => b.setAttribute('aria-selected', j === i));
  [0,1,2,3].forEach(j => document.getElementById('p' + j).hidden = j !== i);
  if (i === 1) renderCombo();
  if (i === 2) renderRecent();
  if (i === 3) renderSuper();
  saveState();
}
BTNS.forEach((b, i) => b.onclick = () => mode(i));

['f-range','f-sort'].forEach(id => document.getElementById(id)
  .addEventListener('change', () => { renderFreq(); saveState(); }));
['c-anchor','c-size','c-range'].forEach(id => document.getElementById(id)
  .addEventListener('change', () => { renderCombo(); saveState(); }));
['r-count','r-mark'].forEach(id => document.getElementById(id)
  .addEventListener('change', () => { renderRecent(); saveState(); }));
['s-range','s-sort'].forEach(id => document.getElementById(id)
  .addEventListener('change', () => { renderSuper(); saveState(); }));

const start = loadState();
renderFreq();
mode(start);


}


/* ===================== 主流程：載入 -> 啟動 -> 下拉重整 ===================== */
let _busy = false;
function resetControls(){
  // 把所有會綁事件的控制項換成複製品，清掉舊的監聽，避免重整後重複觸發
  ['f-range','f-sort','c-anchor','c-size','c-range','r-count','r-mark','s-range','s-sort']
    .forEach(id => { const e = $(id); if (e) e.replaceWith(e.cloneNode(true)); });
  const tabs = document.querySelector('.modes') || document.body;
  document.querySelectorAll('[id^="m"]').forEach(b => {
    if (/^m\d$/.test(b.id)) b.replaceWith(b.cloneNode(true));
  });
}
function stamp(d){
  const el = $('auto');
  if (el) el.textContent = `　·　資料更新於 ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}（下拉可重整）`;
  const built = document.querySelector('.built');
  if (built) built.firstChild.textContent = `資料來源：台灣彩券官網${goodRoute>0?'（經'+ROUTES[goodRoute].name+'）':''}（最近 ${window.D ? window.D.n : ''} 期）　`;
}
async function go(){
  if (_busy) return;
  _busy = true;
  try {
    const D = await loadData();
    window.D = D;
    resetControls();
    boot(D);
    stamp(D.fetchedAt);
  } catch (e) {
    const detail = routeLog.length ? '<br><br><small>' + routeLog.join('<br>') + '</small>' : '';
    showMsg('連線失敗了：' + (e && e.message ? e.message : e) +
      '<br><br>可能是手機沒網路，或連線被擋住。請下拉重整再試一次。' + detail +
      '<br><br><small>（若一直失敗，請把這個畫面拍照傳給我）</small>');
  } finally {
    _busy = false;
  }
}

/* 下拉重整（手機手指往下拉） */
let startY = 0, pulling = false;
window.addEventListener('touchstart', e => {
  if (window.scrollY <= 0){ startY = e.touches[0].clientY; pulling = true; }
}, {passive: true});
window.addEventListener('touchmove', e => {
  if (!pulling) return;
  const dy = e.touches[0].clientY - startY;
  const hint = $('pullhint');
  if (dy > 10 && hint){ hint.style.display = 'block';
    hint.textContent = dy > 70 ? '放開以重整 ↻' : '下拉重整 ↓'; }
}, {passive: true});
window.addEventListener('touchend', e => {
  const hint = $('pullhint');
  if (pulling && hint && hint.style.display === 'block'){
    const refresh = (e.changedTouches[0].clientY - startY) > 70;
    hint.style.display = 'none';
    if (refresh) go();
  }
  pulling = false;
}, {passive: true});

go();

</script>
</html>
